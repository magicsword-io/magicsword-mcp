name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify public repository and main ancestry
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          RELEASE_IMMUTABLE: ${{ github.event.release.immutable }}
        run: |
          test "$GITHUB_REPOSITORY" = "magicsword-io/magicsword-mcp"
          test "$REPOSITORY_PRIVATE" = "false"
          test "$RELEASE_IMMUTABLE" != "true" || { echo 'This workflow attaches tested assets after publishing; immutable releases need a draft-asset workflow first.'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Pin npm CLI for trusted publishing
        run: npm install --global npm@11.12.0

      - name: Validate release and materialize its version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release.mjs

      - name: Refuse duplicate or older npm publication
        run: node scripts/check-unpublished.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify all release metadata
        run: npm run release:verify -- "$GITHUB_REF_NAME"

      - name: Typecheck
        run: npm run typecheck

      - name: Audit all dependencies
        run: npm audit

      - name: Test package
        run: npm test

      - name: Test installed production package
        run: npm run test:package

      - name: Build and test desktop installer before publication
        run: |
          npm run bundle:desktop
          npm run test:desktop

      - name: Retain the tested desktop installer bytes
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-${{ github.ref_name }}
          path: release-assets/magicsword-mcp.mcpb*
          if-no-files-found: error
          retention-days: 90

      - name: Publish with npm trusted publishing
        run: npm publish --access public

  publish-registry:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate release and materialize Registry version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release.mjs

      - name: Wait for npm package availability
        env:
          PACKAGE_NAME: '@magicsword-io/magicsword-mcp'
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          version="${PACKAGE_VERSION#v}"
          for attempt in {1..120}; do
            npm view "${PACKAGE_NAME}@${version}" version && exit 0
            printf 'Waiting for npm availability (attempt %s/120)...\n' "$attempt"
            sleep 5
          done
          exit 1

      - name: Install MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: '1.8.1'
          MCP_PUBLISHER_SHA256: 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc'
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            -o mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz

      - name: Publish to the official MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json

  publish-desktop:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the exact tested installer
        uses: actions/download-artifact@v8
        with:
          name: desktop-release-${{ github.ref_name }}
          path: release-assets

      - name: Verify the downloaded checksum
        working-directory: release-assets
        run: sha256sum --check magicsword-mcp.mcpb.sha256

      - name: Attach installer and checksum to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in magicsword-mcp.mcpb magicsword-mcp.mcpb.sha256; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              verification_dir="$(mktemp -d)"
              gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$verification_dir"
              cmp "release-assets/$asset" "$verification_dir/$asset"
            else
              gh release upload "$GITHUB_REF_NAME" "release-assets/$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done
